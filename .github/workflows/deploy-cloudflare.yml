name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Mint Cloudflare access token
        id: cfauth
        env:
          CLOUDFLARE_REFRESH_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN }}
          CLOUDFLARE_OAUTH_CLIENT_ID: ${{ secrets.CLOUDFLARE_OAUTH_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN_FALLBACK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CLIENT_ID="${CLOUDFLARE_OAUTH_CLIENT_ID:-54d11594-84e4-41aa-b438-e81b8fa78ee7}"
          ACCESS=""

          if [ -n "${CLOUDFLARE_REFRESH_TOKEN:-}" ]; then
            echo "Refreshing Cloudflare OAuth access token..."
            RESP=$(curl -sS -X POST "https://dash.cloudflare.com/oauth2/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "User-Agent: wrangler/4.115.0" \
              -H "Accept: application/json" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=${CLOUDFLARE_REFRESH_TOKEN}" \
              --data-urlencode "client_id=${CLIENT_ID}" || true)
            ACCESS=$(python3 -c 'import json,sys
try:
  d=json.loads(sys.argv[1])
except Exception:
  d={}
print(d.get("access_token") or "")' "$RESP")
          fi

          if [ -z "$ACCESS" ] && [ -n "${CLOUDFLARE_API_TOKEN_FALLBACK:-}" ]; then
            echo "Using CLOUDFLARE_API_TOKEN fallback secret"
            ACCESS="$CLOUDFLARE_API_TOKEN_FALLBACK"
          fi

          if [ -z "$ACCESS" ]; then
            echo "Unable to obtain Cloudflare credentials"
            exit 1
          fi

          echo "::add-mask::${ACCESS}"
          # Write for later steps without printing
          {
            echo "CLOUDFLARE_API_TOKEN<<EOF"
            echo "$ACCESS"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Cloudflare credentials ready"

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Worker
        run: |
          npx opennextjs-cloudflare build
          npm run cf:prune-assets
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://cvin.bio' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_FROM: news@cvin.bio
          CLOUDFLARE_EMAIL_FROM_NAME: CVin.Bio
          CLOUDFLARE_MARKETING_FROM: news@cvin.bio
          CLOUDFLARE_MARKETING_FROM_NAME: CVin.Bio
          CONTACT_NOTIFY_EMAIL: ${{ secrets.CONTACT_NOTIFY_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_BASE_URL: ${{ secrets.WHATSAPP_BASE_URL }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
          WHATSAPP_SESSION_ID: ${{ secrets.WHATSAPP_SESSION_ID }}

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Cloudflare Workers deploy"
            echo "- Worker: \`cvinbio\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Auth: Wrangler OAuth refresh token (minted each run)"
            echo "- Auto-deploys on every push to \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"
