name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Prefer long-lived API token. OAuth refresh is fallback only (and rotates).
      - name: Resolve Cloudflare credentials
        id: cfauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_REFRESH_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN }}
          CLOUDFLARE_OAUTH_CLIENT_ID: ${{ secrets.CLOUDFLARE_OAUTH_CLIENT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/mint-cloudflare-token.mjs

      - name: Persist rotated OAuth refresh token
        if: steps.cfauth.outputs.refresh_rotated == 'true'
        env:
          REFRESH_ROTATED: ${{ steps.cfauth.outputs.refresh_rotated }}
          CLOUDFLARE_SECRETS_PAT: ${{ secrets.CLOUDFLARE_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/update-cf-refresh-secret.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Worker
        run: |
          node -e '
            const fs = require("fs");
            const keys = [
              "NEXT_PUBLIC_SITE_URL","NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_ANON_KEY",
              "NEXT_PUBLIC_POSTHOG_HOST","NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN",
              "SUPABASE_SERVICE_ROLE_KEY","SUPABASE_KEY","RESEND_API_KEY","GEMINI_API_KEY",
              "OPENAI_API_KEY","OPENAI_MODEL","POSTHOG_PERSONAL_API_KEY","POSTHOG_PROJECT_ID",
              "CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_EMAIL_FROM","CLOUDFLARE_EMAIL_FROM_NAME",
              "CLOUDFLARE_MARKETING_FROM","CLOUDFLARE_MARKETING_FROM_NAME","CONTACT_NOTIFY_EMAIL",
              "TELEGRAM_BOT_TOKEN","TELEGRAM_CHANNEL_ID","THREADS_ACCESS_TOKEN","THREADS_USER_ID",
              "META_PAGE_TOKEN","META_PAGE_ID","META_IG_USER_ID","BUFFER_ACCESS_TOKEN","BUFFER_ORG_ID",
              "BUFFER_TOKEN","JSEARCH_API_KEY","JOOBLE_API_KEY","CAREERJET_API_KEY","ADZUNA_APP_ID",
              "ADZUNA_APP_KEY","WHATSAPP_API_KEY","WHATSAPP_BASE_URL","WHATSAPP_CHANNEL_ID","WHATSAPP_SESSION_ID"
            ];
            let out = "";
            for (const k of keys) {
              const v = process.env[k];
              if (v !== undefined && v !== "") out += k + "=" + v + "\n";
            }
            fs.writeFileSync(".env.production.local", out);
            console.log("wrote .env.production.local with", out.trim() ? out.trim().split("\n").length : 0, "vars");
          '
          npx opennextjs-cloudflare build
          npm run cf:prune-assets
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://cvin.bio' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4.1' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_FROM: news@cvin.bio
          CLOUDFLARE_EMAIL_FROM_NAME: CVin.Bio
          CLOUDFLARE_MARKETING_FROM: news@cvin.bio
          CLOUDFLARE_MARKETING_FROM_NAME: CVin.Bio
          CONTACT_NOTIFY_EMAIL: ${{ secrets.CONTACT_NOTIFY_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_BASE_URL: ${{ secrets.WHATSAPP_BASE_URL }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
          WHATSAPP_SESSION_ID: ${{ secrets.WHATSAPP_SESSION_ID }}

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Token was written to GITHUB_ENV by mint script (static or oauth)
        run: npx wrangler deploy

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Cloudflare Workers deploy"
            echo "- Worker: \`cvinbio\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Auth mode: \`${{ steps.cfauth.outputs.auth_mode }}\`"
            echo "- Prefer long-lived API token (no rotation) over OAuth refresh"
            echo "- Auto-deploys on every push to \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"
