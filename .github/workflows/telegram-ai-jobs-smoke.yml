name: Smoke AI jobs Telegram dual-post

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Post sample AI jobs digest to both channels
        env:
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
        run: |
          node <<'EOF'
          const token = process.env.TELEGRAM_AI_BOT_TOKEN;
          if (!token) throw new Error('missing TELEGRAM_AI_BOT_TOKEN');

          const text = [
            '• Anthropic is hiring <a href="https://cvin.bio">Research Engineer</a>',
            '• OpenAI is hiring <a href="https://cvin.bio">Software Engineer</a>',
            '• Cohere is hiring <a href="https://cvin.bio">Forward Deployed Engineer</a>',
            '• Mistral AI is hiring <a href="https://cvin.bio">ML Infrastructure Engineer</a>',
            '• Perplexity is hiring <a href="https://cvin.bio">Product Engineer</a>',
            '',
            '_',
            'Web3 Jobs: <a href="https://t.me/web3hiring">t.me/web3hiring</a>',
            '',
            '<i>(smoke test — dual-post check)</i>',
          ].join('\n');

          async function send(chat_id) {
            const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id,
                text,
                parse_mode: 'HTML',
                disable_web_page_preview: true,
              }),
            });
            const data = await res.json();
            if (!data.ok) throw new Error(`${chat_id}: ${JSON.stringify(data)}`);
            console.log(`✅ ${chat_id} message ID: ${data.result.message_id}`);
          }

          for (const chat of ['@hashtag_ai', '@globalAIjobs']) {
            await send(chat);
          }
          EOF
