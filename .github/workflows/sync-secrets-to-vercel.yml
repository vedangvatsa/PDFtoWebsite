name: Sync Secrets to Vercel
on: workflow_dispatch

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Sync all secrets to Vercel
        run: |
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          
          sync_env() {
            local name=$1
            local value=$2
            if [ -z "$value" ]; then
              echo "⏭️  Skipping $name (empty)"
              return
            fi
            # Remove from all environments (ignore errors)
            for env in production preview development; do
              vercel env rm "$name" "$env" --yes --token="$TOKEN" 2>/dev/null || true
            done
            # Add to all environments
            for env in production preview development; do
              echo -n "$value" | vercel env add "$name" "$env" --token="$TOKEN" 2>/dev/null && echo "  ✅ $name → $env" || echo "  ⚠️ $name → $env (may already exist)"
            done
          }

          echo "🔄 Syncing secrets to Vercel..."
          echo ""
          
          echo "── PostHog ──"
          sync_env "POSTHOG_PERSONAL_API_KEY" "${{ secrets.POSTHOG_PERSONAL_API_KEY }}"
          
          echo "── Meta ──"
          sync_env "META_PAGE_ID" "${{ secrets.META_PAGE_ID }}"
          sync_env "META_PAGE_TOKEN" "${{ secrets.META_PAGE_TOKEN }}"
          sync_env "META_IG_USER_ID" "${{ secrets.META_IG_USER_ID }}"
          
          echo "── Buffer ──"
          sync_env "BUFFER_TOKEN" "${{ secrets.BUFFER_TOKEN }}"
          sync_env "BUFFER_ACCESS_TOKEN" "${{ secrets.BUFFER_ACCESS_TOKEN }}"
          sync_env "BUFFER_ORG_ID" "${{ secrets.BUFFER_ORG_ID }}"
          
          echo "── Threads ──"
          sync_env "THREADS_ACCESS_TOKEN" "${{ secrets.THREADS_ACCESS_TOKEN }}"
          sync_env "THREADS_USER_ID" "${{ secrets.THREADS_USER_ID }}"
          
          echo ""
          echo "🎉 Done! Trigger a redeploy on Vercel to pick up the new env vars."

      - name: Trigger Vercel redeploy
        run: |
          echo "Triggering redeploy..."
          vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes 2>&1 | tail -5
