name: Jobs Sync (daily original listings)

on:
  schedule:
    # Daily, capped intake. All new rows need an original employer description.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'AI100 first, then general feeds; or AI100 only'
        type: choice
        options: [all, ai100]
        default: all
      mass_scan:
        description: 'Check all 19k+ jobs for 404s in parallel (HEAVY — never use on Free tier unless necessary)'
        type: boolean
        default: false
      run_prune:
        description: 'Also run prune-404s after sync (skip on Free tier unless needed)'
        type: boolean
        default: false

concurrency:
  group: jobs-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync jobs and import original employer descriptions
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          FINDWORK_API_KEY: ${{ secrets.FINDWORK_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          # Free Nano: small batches, low parallelism
          JOBS_SYNC_BATCH_SIZE: '75'
          JOBS_SYNC_CONCURRENCY: '2'
          JOBS_SYNC_EXPAND_KNOWN_REMOTE_TECH: '1'
          JOBS_SYNC_MAX_NEW: '500'
          JOBS_SYNC_SCOPE: ${{ inputs.scope || 'all' }}
          AI_COVERAGE_OUTPUT: ${{ runner.temp }}/ai100-coverage.json
          # Original source text only; serial imports with a bounded queue.
          SOURCE_IMPORT_BATCH_SIZE: '100'
        run: node .github/scripts/jobs-sync.mjs

      - name: Preserve AI100 source and intake coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai100-coverage
          path: ${{ runner.temp }}/ai100-coverage.json
          if-no-files-found: warn
          retention-days: 14

      # Prune is heavy (HTTP checks + DB). Off on schedule; only when manually requested.
      - name: Prune dead job links
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.run_prune == 'true' || github.event.inputs.mass_scan == 'true') }}
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASS_SCAN: ${{ github.event.inputs.mass_scan }}
        run: node .github/scripts/prune-404s.mjs
