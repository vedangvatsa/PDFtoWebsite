name: Jobs Sync (Daily)

on:
  schedule:
    # Run ONCE a day to stay within GitHub's 2,000 free minutes/month limit.
    # The massive LinkedIn scrape takes ~50 mins per run (1,500 mins/month total).
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Only run the job sync (skip posting)'
        type: boolean
        default: false
      mass_scan:
        description: 'Check all 19k+ jobs for 404s in parallel'
        type: boolean
        default: false

concurrency:
  group: jobs-sync-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync remote jobs
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          FINDWORK_API_KEY: ${{ secrets.FINDWORK_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: node .github/scripts/jobs-sync.mjs

      - name: Prune dead job links
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASS_SCAN: ${{ github.event.inputs.mass_scan }}
        run: node .github/scripts/prune-404s.mjs

