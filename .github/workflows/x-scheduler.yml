name: Jobs Sync (every 1–2 days + LinkedIn weekly)

on:
  schedule:
    # Free-tier: refresh jobs about every 2 days (not twice/day).
    # Cron: 00:00 UTC on even calendar days of the month → ~1–2 day gap.
    - cron: '0 0 */2 * *'
    # Sunday 03:00 UTC: same pipeline + LinkedIn scrape
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Only run the job sync (skip posting)'
        type: boolean
        default: false
      mass_scan:
        description: 'Check all 19k+ jobs for 404s in parallel (HEAVY — never use on Free tier unless necessary)'
        type: boolean
        default: false
      run_prune:
        description: 'Also run prune-404s after sync (skip on Free tier unless needed)'
        type: boolean
        default: false
      include_linkedin:
        description: 'Include LinkedIn scrape (heavy; also runs automatically on Sundays)'
        type: boolean
        default: false

concurrency:
  group: jobs-sync-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync remote jobs
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          FINDWORK_API_KEY: ${{ secrets.FINDWORK_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          # Free Nano: small batches, low parallelism
          JOBS_SYNC_BATCH_SIZE: '75'
          JOBS_SYNC_CONCURRENCY: '2'
          # LinkedIn only on Sunday cron or manual include_linkedin
          INCLUDE_LINKEDIN: ${{ github.event.schedule == '0 3 * * 0' || github.event.inputs.include_linkedin == true }}
        run: node .github/scripts/jobs-sync.mjs

      # Prune is heavy (HTTP checks + DB). Off on schedule; only when manually requested.
      - name: Prune dead job links
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.run_prune == 'true' || github.event.inputs.mass_scan == 'true') }}
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASS_SCAN: ${{ github.event.inputs.mass_scan }}
        run: node .github/scripts/prune-404s.mjs

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHANNEL_ID }}" \
            -d text="⚠️ jobs-sync failed — job feed / companies directory may be stale. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

