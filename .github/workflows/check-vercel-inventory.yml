name: check-vercel-inventory

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-vercel-inventory.yml"
      - ".github/scripts/check-vercel-inventory.mjs"

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: List Vercel projects and domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node .github/scripts/check-vercel-inventory.mjs
