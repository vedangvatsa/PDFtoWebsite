name: Profile Reminder Pass 2 (auth emails)

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send remaining incomplete-profile emails
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://cvin.bio
        run: node .github/scripts/send-profile-reminder-pass2.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-reminder-pass2-results
          path: profile-reminder-pass2-results.json
          if-no-files-found: warn
