name: Post AI jobs (Telegram only)

on:
  workflow_dispatch:

concurrency:
  group: telegram-ai-jobs-once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Verify bot can post to both channels
        env:
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
        run: |
          node <<'EOF'
          const token = process.env.TELEGRAM_AI_BOT_TOKEN;
          if (!token) throw new Error('missing TELEGRAM_AI_BOT_TOKEN');
          const api = (method, body) =>
            fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            }).then((r) => r.json());

          const me = await api('getMe', {});
          if (!me.ok) throw new Error(JSON.stringify(me));
          console.log('bot:', me.result.username);

          for (const chat_id of ['@hashtag_ai', '@globalAIjobs']) {
            const chat = await api('getChat', { chat_id });
            const member = await api('getChatMember', {
              chat_id,
              user_id: me.result.id,
            });
            console.log(JSON.stringify({
              chat_id,
              ok: chat.ok && member.ok,
              type: chat.result?.type,
              title: chat.result?.title,
              username: chat.result?.username,
              status: member.result?.status,
              error: chat.ok ? (member.ok ? null : member) : chat,
            }));
            if (!chat.ok || !member.ok || !['administrator', 'creator'].includes(member.result?.status)) {
              throw new Error(`Bot is not admin on ${chat_id}`);
            }
          }
          EOF

      - name: Post AI jobs to @hashtag_ai and @globalAIjobs
        env:
          TELEGRAM_AI_BOT_TOKEN: ${{ secrets.TELEGRAM_AI_BOT_TOKEN }}
          TELEGRAM_AI_CHANNEL_ID: '@hashtag_ai'
          TELEGRAM_AI_EXTRA_CHANNEL_IDS: '@globalAIjobs'
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node .github/scripts/telegram-ai-jobs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/.telegram-ai-jobs-posted.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update AI jobs dedup state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep $((i * 3))
            done
          fi
